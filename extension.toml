name = "Modbus Control"
version = "0.1.0"
description = "A tab to read and write Modbus registers: mapped ones by name with live values, or raw addresses in the holding, input, coil and discrete tables (raw writes need the extension's Allow Raw Writes setting). Writes are range-checked. Needs the Modbus agent extension."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-app-modbus"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["modbus", "modbus-tcp", "modbus-rtu", "registers", "coils", "plc", "scada", "industrial", "automation", "register table", "register editor", "holding register", "input register", "coil", "discrete input", "write register", "read register", "hex address", "float32", "word order"]
categories = ["Industrial", "Automation", "Diagnostics"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[app]
tab = "dist/tab/index.html"

[package]
paths = ["LICENSE", "dist"]
